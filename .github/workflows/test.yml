name: AgroAssist E2E QA Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'backend/package-lock.json'

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python Test Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Backend Node Dependencies
      run: |
        cd backend
        npm install
        cd ..

    - name: Start Backend Application Server
      run: |
        cd backend
        node src/server.js &
        cd ..

    - name: Wait for Application Health Check (HTTP 200)
      run: |
        echo "Waiting for AgroAssist backend application to become ready..."
        for i in {1..30}; do
          if curl -s http://localhost:3000/api/health | grep -q '"status":"OK"'; then
            echo "Application is online and healthy!"
            exit 0
          fi
          echo "Waiting for server (attempt $i/30)..."
          sleep 1
        done
        echo "Application failed to start within timeout"
        exit 1

    - name: Execute Full E2E Test Suite (325 Test Cases)
      env:
        BASE_URL: ${{ secrets.TEST_BASE_URL || 'http://localhost:3000' }}
        API_BASE_URL: ${{ secrets.API_BASE_URL || 'http://localhost:3000/api' }}
        TEST_EMAIL: ${{ secrets.TEST_EMAIL || 'ramesh@example.com' }}
        TEST_PASSWORD: ${{ secrets.TEST_PASSWORD || 'password123' }}
        HEADLESS: 'true'
      run: |
        python run_all_tests.py

    - name: Upload Excel Test Results Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-excel
        path: reports/test_results.xlsx
        if-no-files-found: error

    - name: Upload HTML Test Report Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-html
        path: reports/html/
        if-no-files-found: ignore

    - name: Upload Screenshots Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-screenshots
        path: reports/screenshots/
        if-no-files-found: ignore
