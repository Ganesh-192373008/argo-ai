name: AgroAssist E2E QA Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install System Dependencies & Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y wget curl unzip libxi6 libgconf-2-4 libnss3
        sudo apt-get install -y google-chrome-stable || true

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Backend Node Dependencies & Start Local Backend Server
      run: |
        cd backend
        npm install || true
        node src/server.js &
        sleep 5
        cd ..

    - name: Run E2E Test Suite & Generate Excel/HTML Reports
      env:
        BASE_URL: ${{ secrets.TEST_BASE_URL || 'http://localhost:3000' }}
        API_BASE_URL: ${{ secrets.API_BASE_URL || 'http://localhost:3000/api' }}
        TEST_EMAIL: ${{ secrets.TEST_EMAIL || 'ramesh@example.com' }}
        TEST_PASSWORD: ${{ secrets.TEST_PASSWORD || 'password123' }}
        HEADLESS: 'true'
      run: |
        python run_all_tests.py

    - name: Upload Excel Test Results Artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-results-excel
        path: reports/test_results.xlsx
        if-no-files-found: error

    - name: Upload HTML Test Report Artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-results-html
        path: reports/html/
        if-no-files-found: ignore

    - name: Upload Screenshots Artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-screenshots
        path: reports/screenshots/
        if-no-files-found: ignore
